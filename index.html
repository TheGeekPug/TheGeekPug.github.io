<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>youareapug</title>
    <style>
        /* Elimina márgenes y evita que aparezcan barras de scroll */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #d3d3d3; /* Fondo plomo claro / gris claro */
        }

        /* Contenedor adaptado para tocar techo y suelo sin deformar la imagen */
        .browser-contain {
            width: 100%;
            height: 100%;
            background-image: url('do not enter this website....png');
            background-position: center center; /* Centrado perfecto vertical y horizontal */
            background-repeat: no-repeat;
            background-size: contain; /* Toca los bordes superior e inferior sin deformarse */
        }
    </style>
</head>
<body>

    <div class="browser-contain"></div>

</body>
</html>
