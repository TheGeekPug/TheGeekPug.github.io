<!DOCTYPE html>
<html lang="en" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>YouAreAPug</title>
    <!-- Favicon configuration pointing to the requested image -->
    <link rel="icon" type="image/jpeg" href="thegeekpug.jpg">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            /* Prevents user from selecting text or elements on the page */
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        body {
            background-color: #d3d3d3; 
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; 
        }

        .main-image {
            height: 100vh; 
            width: auto;   
            object-fit: contain; 
            /* Disables specific pointer events to prevent touch-and-hold saving on mobile devices */
            -webkit-touch-callout: none;
        }
    </style>
</head>
<body class="notranslate">

    <!-- Right-click and dragging are disabled on the image to prevent saving/downloading -->
    <img src="do not enter this website....png" 
         alt="Do not enter this website" 
         class="main-image" 
         oncontextmenu="return false;" 
         ondragstart="return false;">

    <script>
        // Disables right-click across the entire page
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        // Blocks common developer tool shortcuts (F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U)
        document.addEventListener('keydown', function(e) {
            if (
                e.key === 'F12' || 
                (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'i' || e.key === 'j')) || 
                (e.ctrlKey && (e.key === 'U' || e.key === 'u'))
            ) {
                e.preventDefault();
                return false;
            }
        });
    </script>
</body>
</html>
