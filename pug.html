<!DOCTYPE html>
<!-- Bloqueo estándar de traducción en el elemento raíz -->
<html lang="en" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>do not enter this website...</title>
    
    <!-- Forzado estricto para evitar que Google Chrome active el aviso de traducción -->
    <meta name="google" content="notranslate">
    
    <style>
        body {
            background-color: #E2E2E2;
            font-family: "Times New Roman", Times, serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 4rem;
            font-weight: bold;
            color: #000000;
            margin-bottom: 40px;
            text-align: center;
        }

        .image-container {
            max-width: 600px;
            width: 100%;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .image-container img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<!-- La clase "notranslate" asegura que el motor de Chrome ignore el contenido de texto interno -->
<body class="notranslate">

    <h1>You fell into my trap!!</h1>

    <div class="image-container">
        <img src="do not enter this website....png" alt="Pug looking over a ledge">
    </div>

</body>
</html>
